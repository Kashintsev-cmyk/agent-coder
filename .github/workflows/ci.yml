name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
        env:
          # Заглушки, чтобы config.validate() не падал на импорте.
          ROUTERAI_API_KEY: sk-test-ci-dummy
          TELEGRAM_TOKEN: "0:test"
          TELEGRAM_USER_ID: "1"
          # Изоляция от окружения раннера.
          DEFAULT_WORKSPACE: /tmp
          MODELS_CACHE_DIR: /tmp/agent-coder-cache
          SESSIONS_DIR_OVERRIDE: /tmp/agent-coder-sessions
