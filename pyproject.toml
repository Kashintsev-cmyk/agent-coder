[project]
name = "agent-coder"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "CLI coding agent powered by RouterAI"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "aiogram>=3.13,<4",
]

[project.scripts]
agent-coder = "agent_coder.__main__:main"
agent-coder-bot = "agent_coder.telegram.bot:main"
agent-coder-migrate = "agent_coder.migrate:main"
agent-coder-scaffold = "agent_coder.scaffold_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "ruff>=0.6",
    # CI гоняет `python3 -m bandit` (шаг "Bandit security scan"). Без этой
    # строки `pip install -e ".[dev]"` не ставит bandit и шаг CI падает с
    # "No module named bandit" — проверка была прописана, но не выполнялась.
    "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["agent_coder*"]

[tool.setuptools.package-data]
"agent_coder.templates" = [
    "*.md",
    "*.toml",
    "*.yml",
    "*.in",
    ".gitignore-base",
]

# mypy входит в CI (шаг "Mypy", только Python 3.12 — второй матричный
# прогон ничего нового не даёт). handlers/ исключён: union-attr от aiogram
# 3.x одного класса (Message | InaccessibleMessage | None).
[tool.mypy]
python_version = "3.12"
files = ["agent_coder"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_unused_configs = true
# handlers/ исключён: ~150 union-attr от aiogram 3.x,
# все одного класса (Message | InaccessibleMessage | None).
# mypy не видит защитных `if not session` в коде. Сигнал/шум = 0.
exclude = ['^agent_coder/telegram/handlers/.*\.py$']
# Не разбирать ошибки в импортах — только в явно указанных файлах.
# Иначе handlers.py подтягивается через цепочку импортов и игнорирует exclude.
follow_imports = 'silent'

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except — осознанно (approval, error handlers)
    "S110",     # try-except-pass — осознанно (best-effort, не падать)
    "S112",     # try-except-continue — осознанно (пропустить битый файл)
    "ASYNC230", # blocking open() — файлы мелкие, не критично
]