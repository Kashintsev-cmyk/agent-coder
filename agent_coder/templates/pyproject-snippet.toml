# Фрагмент для pyproject.toml нового проекта.
# agent-coder scaffold подставляет source = ["<package>"] автоматически;
# при ручном копировании замените source = ["app"] на имя пакета.

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: медленные тесты (skip: -m 'not slow')",
    "integration: требуют внешних сервисов",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# Что проверять: пакет проекта (scaffold подставит его имя сюда).
# CI запускает `mypy` без аргументов — список берётся из files.
files = ["app"]
# Мягкий профиль: ловит явные ошибки, не мешает писать код.
# Ужесточать до strict = true по мере покрытия типами.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
# Сторонние библиотеки без стабов не должны валить проверку.
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/.venv/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
