# Шаблон CI. Включить, когда появится git remote.
# Копировать в каталог проекта:
#   mkdir -p .github/workflows
#   cp agent_coder/templates/ci-template.yml .github/workflows/ci.yml
# или: agent-coder scaffold --project <name> (делает это сам)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install
        run: uv pip install --system -r requirements-dev.txt

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q
