# Вариант A (прямой): отключить PrivateTmp, чтобы `/tmp` бота и хоста
# были ОДНИМ каталогом.
#
# Проблема, которую решаем:
#   PrivateTmp=true монтирует юниту приватный tmpfs/ext4-подкаталог:
#     /tmp -> /tmp/systemd-private-<id>-agent-coder-bot.service-<rand>/tmp
#   Процессы внутри юнита видят его как /tmp, а снаружи (на хосте, в ssh,
#   в `ls /tmp`) этого каталога НЕ видно, и он УДАЛЯЕТСЯ при остановке
#   юнита. Отсюда «мы пишем в /tmp, а файла нет».
#
# ВАЖНО: одного PrivateTmp=no НЕДОСТАТОЧНО.
#   Юнит работает с ProtectSystem=strict -> корень `/` смонтирован `ro`
#   (проверено: `grep ' / ro' /proc/self/mountinfo`), а /tmp лежит на том
#   же ext4 /dev/vda1, не отдельным монтированием. Без ReadWritePaths
#   реальный /tmp будет виден, но только для чтения.
#   Поэтому ниже явно возвращаем запись.
#
# Применение: patches/apply.sh A  (см. patches/README.md)
# Стоимость: /tmp становится общим -> ослабление изоляции (см. README,
# раздел «Риски»). Если изоляцию нужно сохранить — используйте вариант B.

[Service]
PrivateTmp=no
ReadWritePaths=/tmp
ReadWritePaths=-/var/tmp
