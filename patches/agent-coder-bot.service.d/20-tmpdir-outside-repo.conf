# Вариант B (рекомендуемый): PrivateTmp ОСТАЁТСЯ включённым, а временные
# файлы уводятся в каталог ВНЕ репозитория, который виден снаружи.
#
# Проблема, которую решаем:
#   PrivateTmp=true монтирует юниту приватный tmp-каталог:
#     /tmp -> /tmp/systemd-private-<id>-agent-coder-bot.service-<rand>/tmp
#   Процессы внутри юнита видят его как /tmp, а снаружи (ssh, `ls /tmp`)
#   этого каталога НЕ видно, и он УДАЛЯЕТСЯ при остановке юнита. Отсюда
#   «пишем в /tmp, а файла нет».
#
# Почему вариант B лучше A:
#   - PrivateTmp=true сохраняется -> /tmp хоста не расшарен, изоляция жива;
#   - Python (tempfile.gettempdir(), pytest tmp_path, mkstemp) и большинство
#     утилит (git, pip, gcc) уважают TMPDIR -> пишут в наш каталог;
#   - каталог переживает рестарт юнита и виден снаружи сразу.
#
# ПОЧЕМУ НЕ ВНУТРИ РЕПОЗИТОРИЯ (~/bots/agent-coder/tmp):
#   _workspace_allowed() (agent_coder/telegram/handlers/project_utils.py:42)
#   считает любой путь под деревом репозитория «собственным кодом бота» и
#   отклоняет его. TMPDIR там -> pytest tmp_path уезжает в <repo>/tmp ->
#   2 failed в tests/test_new_workspace_whitelist.py, а ACT-сессия в
#   воркспейсе (/new) не открывается вовсе. Поэтому ~/.cache/agent-coder/tmp.
#
# tempfile базовый каталог сам не создаёт -> в юните есть
# ExecStartPre=/bin/mkdir -p, а apply.sh создаёт его при установке.
#
# Ограничение: процесс, который пишет в /tmp жёстко (не через TMPDIR),
# всё равно уйдёт в приватный tmp. В коде agent-coder таких мест нет —
# используется tempfile, а clean_env() пробрасывает TMPDIR/TEMP/TMP в
# untrusted-subprocess (agent_coder/shell_runner.py:_CLEAN_ENV_KEYS).
#
# Применение: patches/apply.sh B  (см. patches/README.md)

[Service]
Environment=TMPDIR=/home/botuser/.cache/agent-coder/tmp
Environment=TEMP=/home/botuser/.cache/agent-coder/tmp
Environment=TMP=/home/botuser/.cache/agent-coder/tmp
# Каталог уже покрыт ReadWritePaths=-/home/botuser/.cache/agent-coder
# в самом юните; строка ниже — страховка, если то правило поменяют.
ReadWritePaths=-/home/botuser/.cache/agent-coder/tmp
